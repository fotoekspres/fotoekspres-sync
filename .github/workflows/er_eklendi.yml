name: Erdijital yeni urunler eklendi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eklendi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yeni kodlari mevcut listesine ekle, dosyalari yeniden uret
        run: |
          python er_uret.py --eklendi
          python er_uret.py
      - name: Kaydet
        run: |
          git config user.name "fotoekspres-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feed data
          git diff --cached --quiet || git commit -m "Erdijital yeni urunler eklendi: $(date -u +%F)"
          git push
